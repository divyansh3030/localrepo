<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Timetable</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #333;
      color: white;
    }
    .highlight-day {
      background-color: #ffeb3b;
      color: #000;
    }
    .edit-btn, .delete-btn {
      margin: 4px;
      cursor: pointer;
    }
    form {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Dynamic Timetable</h1>
  <form id="entryForm">
    <input type="text" id="subject" placeholder="Subject Name" required>
    <select id="day" required></select>
    <select id="time" required></select>
    <button type="submit">Add Entry</button>
  </form>
  <table id="timetable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  <script>
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const timeSlots = [
      "9:00-10:00", "10:00-11:00", "11:00-12:00",
      "12:00-1:00", "2:00-3:00", "3:00-4:00"
    ];

    const daySelect = document.getElementById("day");
    const timeSelect = document.getElementById("time");
    const subjectInput = document.getElementById("subject");
    const form = document.getElementById("entryForm");
    const table = document.getElementById("timetable").querySelector("tbody");

    // Populate dropdowns
    daySelect.innerHTML = days.map(day => `<option value="${day}">${day}</option>`).join("");
    timeSelect.innerHTML = timeSlots.map(slot => `<option value="${slot}">${slot}</option>`).join("");

    // Create table body rows
    timeSlots.forEach(slot => {
      const row = document.createElement("tr");
      const timeCell = document.createElement("td");
      timeCell.textContent = slot;
      row.appendChild(timeCell);

      days.forEach(() => {
        const cell = document.createElement("td");
        row.appendChild(cell);
      });

      table.appendChild(row);
    });

    // Add entry to timetable
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const subject = subjectInput.value.trim();
      const dayIndex = days.indexOf(daySelect.value) + 1;
      const timeIndex = timeSlots.indexOf(timeSelect.value);
      const cell = table.rows[timeIndex].cells[dayIndex];

      cell.innerHTML = `
        <div class="cell-content">${subject}</div>
        <button class="edit-btn">✏️</button>
        <button class="delete-btn">🗑️</button>
      `;

      form.reset();
    });

    // Edit/Delete logic
    table.addEventListener("click", (e) => {
      if (e.target.classList.contains("edit-btn")) {
        const cell = e.target.closest("td");
        const current = cell.querySelector(".cell-content").textContent;
        const newValue = prompt("Edit Subject:", current);
        if (newValue !== null) {
          cell.querySelector(".cell-content").textContent = newValue;
        }
      }
      if (e.target.classList.contains("delete-btn")) {
        const cell = e.target.closest("td");
        cell.innerHTML = "";
      }
    });

    // Highlight current day
    const currentDayIndex = new Date().getDay();
    const tableHeaders = document.querySelectorAll("thead th");
    if (currentDayIndex >= 1 && currentDayIndex <= 5) {
      tableHeaders[currentDayIndex].classList.add("highlight-day");
    }
  </script>
</body>
</html>
